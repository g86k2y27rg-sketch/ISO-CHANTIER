  #root { height: 100%; }
  input, select, textarea { font-size: 16px; }

</head>
<body>
<div id="splash">Chargement…</div>
<div id="root"></div>
<pre id="errbox"></pre>
<script>

    var b = document.getElementById('errbox');

      (err && err.stack ? '\n\n' + err.stack : '');

    return false;
  };
</script>

            return { x: p.x, y: p.y, angle: 0 };
        }
        return null;
    };

    const shapeHandlePos = (f) => {
        const p = fittingScreen(f);
        if (!p)
            return null;

        const rad = (drawAngle * Math.PI) / 180;
        // demi-encombrement de référence du symbole (avant échelle)

        if (f.shape === "rectangle") {
            halfW = f.rw || 18;
            halfH = f.rh || 11;
        }
        else if (f.shape === "fleche") {
            halfW = -(f.flen != null ? f.flen : 14);
            halfH = 2;
        }
        else if (APPAREIL_TYPES.has(f.type)) {
            halfW = 18;
            halfH = 11;
        }
        const scl = (f.scl || 1) * zoom;
        const lx = halfW * scl, ly = halfH * scl;
        return {
            x: p.x + lx * Math.cos(rad) - ly * Math.sin(rad),
            y: p.y + lx * Math.sin(rad) + ly * Math.cos(rad),
            cx: p.x, cy: p.y, rad,
        };
    };

        if (!p)
            return null;
        if (p.n)
            return nodes[p.n] ? proj(nodes[p.n]) : null;
        if (p.f) {
            const f = fittings.find((x) => x.id === p.f);
            const s = fittingScreen(f);
            return s ? { x: s.x, y: s.y } : null;
        }
        if (p.w)
            return toScreen(p.w);
        return null;
    };

    const distToSeg = (p, a, b, clampMin = 0.1, clampMax = 0.9) => {
        const dx = b.x - a.x, dy = b.y - a.y;
        const L2 = dx * dx + dy * dy;
        if (!L2)
            return { d: Math.hypot(p.x - a.x, p.y - a.y), t: 0.5 };
        let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / L2;
        t = Math.max(clampMin, Math.min(clampMax, t));
        const px = a.x + t * dx, py = a.y + t * dy;
        return { d: Math.hypot(p.x - px, p.y - py), t };
    };
    const findFittingAt = (pt) => {
        let best = null, bd = 1e9;
        for (const f of fittings) {
            const p = fittingScreen(f);
            if (!p)
                continue;
            let d, r;
            if (STRUCTURE_TYPES.includes(f.type)) {
                // distance à la forme réelle, pas à un grand cercle :
                // la tuyauterie proche d'un voile reste sélectionnable
                const scl = (f.scl || 1) * zoom;
                const a = ((f.rot || 0) * Math.PI) / 180;
                const RR = (vx, vy) => ({
                    x: p.x + vx * Math.cos(a) - vy * Math.sin(a),
                    y: p.y + vx * Math.sin(a) + vy * Math.cos(a),
                });
                if (f.type === "mur") {
                    d = distToSeg(pt, RR(0, -48 * scl), RR(0, 48 * scl), 0, 1).d;
                    r = 14;
                }
                else if (f.type === "sol") {
                    d = distToSeg(pt, RR(-58 * scl, 0), RR(58 * scl, 0), 0, 1).d;
                    r = 14;
                }
                else {

                    const dc = Math.hypot(p.x - pt.x, p.y - pt.y);
                    d = Math.abs(dc - 28 * scl);
                    r = 14;
                }
            }
            else if (f.type === "forme") {
                d = Math.hypot(p.x - pt.x, p.y - pt.y);
                r = 14 * (f.scl || 1) * zoom + 8;
            }
            else {
                d = Math.hypot(p.x - pt.x, p.y - pt.y);
                r = 11 * Math.max(0.5, Math.min(1.5, zoom));
            }
            if (d < r && d < bd) {
                bd = d;
                best = f.id;
            }

        return best;
    };
    // ramène une position fractionnaire (t 0-1) le long d'un tube au point
    // de grille entier le plus proche — un organe en ligne doit toujours
    // se poser à un point "propre" (comme un nœud), jamais à une fraction
    // arbitraire calculée au pixel près, sinon sa position est imprévisible.
    const snapTToGrid = (segId, t) => {
        const s = segments.find((x) => x.id === segId);
        if (!s)
            return t;
        const A3 = nodes[s.a], B3 = nodes[s.b];
        if (!A3 || !B3)
            return t;
        const L = Math.max(Math.abs(B3.x - A3.x), Math.abs(B3.y - A3.y), Math.abs(B3.z - A3.z), 1);
        const steps = Math.max(0, Math.min(L, Math.round(t * L)));
        return steps / L;
    };
    const snapFitting = (pt, type) => {
        if (NO_SNAP_TYPES.has(type))
            return null;
        let best = null, bd = 1e9, bt = 0.5;
        for (const s of segments) {
            const A = proj(nodes[s.a]), B = proj(nodes[s.b]);
            const { d, t } = distToSeg(pt, A, B, 0, 1);
            if (d < bd) {
                bd = d;
                best = s;
                bt = t;
            }
        }
        if (!best)
            return null;

        // (tolérance large), pour respecter la logique iso et éviter un
        // placement libre ingérable. Les autres éléments gardent la limite de 32px.
        const limit = INLINE_TYPES.has(type) ? 240 : 32;
        if (bd > limit)
            return null;

        if (Math.hypot(pt.x - A.x, pt.y - A.y) < 16)
            bt = 0;
        else if (Math.hypot(pt.x - B.x, pt.y - B.y) < 16)
            bt = 1;

        // fine (non calée sur un point de grille entier), pour pouvoir en
        // rapprocher plusieurs librement — contrairement aux autres organes
        else if (INLINE_TYPES.has(type) && type !== "soudure" && type !== "souduresw") {
            bt = snapTToGrid(best.id, bt);
        }
        return { segId: best.id, t: bt };
    };
    // géométrie d'une cote alignée sur un axe iso
    const axisDimGeometry = (P, Q, axisIdx, off, flip) => {
        const u = ISO_SCREEN_AXES[axisIdx];
        // lignes d'attache le long d'un des deux autres axes iso
        let e = null, bv = 1e9;
        ISO_SCREEN_AXES.forEach((c, i) => {
            if (i === axisIdx)
                return;
            const v = Math.abs(u.x * c.x + u.y * c.y);
            if (v < bv) {
                bv = v;
                e = c;
            }
        });
        let n = { x: e.x, y: e.y };
        if (n.y > 0)
            n = { x: -n.x, y: -n.y };
        if (flip)
            n = { x: -n.x, y: -n.y };
        const projLen = (Q.x - P.x) * u.x + (Q.y - P.y) * u.y;
        const oz = off * zoom;
        const dA = { x: P.x + n.x * oz, y: P.y + n.y * oz };
        const dB = { x: dA.x + u.x * projLen, y: dA.y + u.y * projLen };
        const ang = (Math.atan2(u.y * Math.sign(projLen || 1), u.x * Math.sign(projLen || 1)) * 180) / Math.PI;
        return { u, n, dA, dB, ang, projLen };
    };
    const bestAxisFor = (P, Q) => {
        let best = 0, bv = -1;
        ISO_SCREEN_AXES.forEach((u, i) => {
            const v = Math.abs((Q.x - P.x) * u.x + (Q.y - P.y) * u.y);
            if (v > bv) {
                bv = v;
                best = i;
            }
        });
        return best;
    };
    // axes iso candidats pour les lignes d'attache d'une direction écran
    // donnée, classés du plus perpendiculaire au moins perpendiculaire
    // (le tube exclut naturellement son propre axe, le moins perpendiculaire)
    const extAxisCandidates = (ux, uy) => {
        // les 3 axes iso sont mathématiquement à équidistance parfaite deux à
        // deux (produit scalaire = 0,5 exactement) : sans arrondi ni départage
        // fixe, un minuscule bruit d'arrondi flottant (qui varie légèrement
        // selon le niveau de zoom) peut faire basculer l'ordre de façon
        // instable — d'où les cotes qui changeaient de ligne d'attache toutes
        // seules au zoom. L'arrondi absorbe ce bruit ; l'indice d'axe départage
        // les égalités exactes de façon fixe, indépendamment du zoom.
        const list = ISO_SCREEN_AXES.map((e, i) => ({
            e, i, v: Math.round(Math.abs(ux * e.x + uy * e.y) * 1e6) / 1e6,
        }));
        list.sort((a, b) => a.v - b.v || a.i - b.i);
        return [list[0].e, list[1].e];
    };
    const bestExtAxis = (ux, uy) => extAxisCandidates(ux, uy)[0];
    const dimGeometry = (P, Q, off, flip, alt) => {
        const dx = Q.x - P.x, dy = Q.y - P.y;
        const L = Math.hypot(dx, dy) || 1;
        // lignes d'attache le long d'un axe iso (jamais perpendiculaires écran) :
        // deux choix valides existent (alt bascule de l'un à l'autre)
        const cands = extAxisCandidates(dx / L, dy / L);
        let e = alt ? cands[1] : cands[0];
        let nx = e.x, ny = e.y;
        if (ny > 0) {
            nx = -nx;
            ny = -ny;
        }
        if (flip) {
            nx = -nx;
            ny = -ny;
        }
        const oz = off * zoom;
        return {
            nx, ny,
            dA: { x: P.x + nx * oz, y: P.y + ny * oz },
            dB: { x: Q.x + nx * oz, y: Q.y + ny * oz },
            ang: (Math.atan2(dy, dx) * 180) / Math.PI,
        };
    };

        if (!s || !s.cote)
            return null;
        const A0 = proj(nodes[s.a]), B0 = proj(nodes[s.b]);
        if (s.caxis != null) {
            const g = axisDimGeometry(A0, B0, s.caxis, 24 + (s.coff || 0), s.flip);
            return {
                x: (g.dA.x + g.dB.x) / 2 + g.n.x * fs(10) * zoom + (s.tox || 0) * zoom,
                y: (g.dA.y + g.dB.y) / 2 + g.n.y * fs(10) * zoom + (s.toy || 0) * zoom,
            };
        }

        return {
            x: (g.dA.x + g.dB.x) / 2 + g.nx * fs(10) * zoom + (s.tox || 0) * zoom,

                if (tp && Math.hypot(tp.x - pt.x, tp.y - pt.y) < 22) {

    const handleMove = (e) => {
