<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #F2F0EA; overscroll-behavior: none;
    font-family: 'Archivo', system-ui, -apple-system, sans-serif; }
  #root { height: 100%; }
  input, select, textarea { font-size: 16px; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }
  #splash { position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; background: #F2F0EA; color: #5A6472;
    font-family: monospace; font-size: 14px; z-index: 1; }
  #errbox { position: fixed; inset: 0; background:#F2F0EA; color:#B3341C;
    font-family: monospace; font-size: 13px; padding: 24px; overflow:auto;
    white-space: pre-wrap; z-index: 9999; display:none; }
  @media print {
    body > *:not(#__pdf_print_overlay) { display: none !important; }
  }

<script>
  window.onerror = function(msg, src, line, col, err) {
    var b = document.getElementById('errbox');
    b.style.display = 'block';
    b.textContent = 'ERREUR :\n' + msg + '\n\nligne ' + line + ':' + col +
      (err && err.stack ? '\n\n' + err.stack : '');
    var s = document.getElementById('splash'); if (s) s.style.display='none';
    return false;
  };
</script>

    const excludeFittingGaps = (A, B, segId) => {
        const gaps = fittingGaps.filter((g) => g.segId === segId);
        if (!gaps.length)
            return [[A, B]];
        const dx = B.x - A.x, dy = B.y - A.y, dz = B.z - A.z;
        const len = Math.hypot(dx, dy, dz) || 1;
        let cuts = [[0, 1]];
        gaps.forEach((g) => {
            const t = ((g.pos.x - A.x) * dx + (g.pos.y - A.y) * dy + (g.pos.z - A.z) * dz) / (len * len);
            const px = A.x + dx * t, py = A.y + dy * t, pz = A.z + dz * t;
            const distToLine = Math.hypot(g.pos.x - px, g.pos.y - py, g.pos.z - pz);
            if (distToLine > g.halfLen * 1.5)
                return; // ce trou concerne un autre point du tracé, pas ce morceau
            const halfT = g.halfLen / len;
            const t0 = t - halfT, t1 = t + halfT;
            const next = [];
            cuts.forEach(([a, b]) => {
                if (t1 <= a || t0 >= b) {
                    next.push([a, b]);
                    return;
                }
                if (t0 > a)
                    next.push([a, Math.min(t0, b)]);
                if (t1 < b)
                    next.push([Math.max(t1, a), b]);
            });
            cuts = next;
        });
        const at = (t) => ({ x: A.x + dx * t, y: A.y + dy * t, z: A.z + dz * t });
        return cuts.filter(([a, b]) => b - a > 1e-4).map(([a, b]) => [at(a), at(b)]);
    };
    const lines = segments.flatMap((s) => {
        const chain = resolved.segChains[s.id];
        if (!chain)
            return [];
        const trimmed = chain.map((p) => ({ ...p }));
        const cutA = roundedJoints[s.id + "_a"];
        if (cutA)
            trimmed[0] = cutA.cut;
        const cutB = roundedJoints[s.id + "_b"];
        if (cutB)
            trimmed[trimmed.length - 1] = cutB.cut;
        const out = [];
        for (let i = 0; i < trimmed.length - 1; i++) {
            splitAgainstWalls(trimmed[i], trimmed[i + 1]).forEach(([A0, B0]) => {
                excludeFittingGaps(A0, B0, s.id).forEach(([A, B], j) => {
                    const pA = screenPt(A), pB = screenPt(B);
                    out.push({ id: s.id + "_" + i + "_" + j, color: s.color, pA, pB, depth: (pA.depth + pB.depth) / 2,
                        mid: { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2, z: (A.z + B.z) / 2 } });
                });
            });
        }
        return out;
    });
    Object.keys(roundedJoints).forEach((k) => {
        if (!k.startsWith("__arc_"))
            return;
        const arcPts = roundedJoints[k].pts;
        for (let i = 0; i < arcPts.length - 1; i++) {
            splitAgainstWalls(arcPts[i], arcPts[i + 1]).forEach(([A, B], j) => {
                const pA = screenPt(A), pB = screenPt(B);
                lines.push({ id: k + "_" + i + "_" + j, color: null, pA, pB, depth: (pA.depth + pB.depth) / 2,
                    mid: { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2, z: (A.z + B.z) / 2 } });
            });
        }
    });
    lines.sort((a, b) => b.depth - a.depth);
    // tubes semi-transparents représentant le vrai diamètre (DN), en plus du
    // trait fin qui reste l'axe officiel — même échelle que le reste de la
    // scène (1 unité = 100mm), donc rayon = DN(mm)/200 ; vrai cylindre à 8
    // faces (pas seulement 2 ailes plates) via une base orthonormée
    // (tangente, w1, w2) par Gram-Schmidt puis produit vectoriel, réutilisée
    // aussi bien pour les tronçons droits que pour les arcs de coude arrondi
    const N_SIDES = 8;
    const cylinderFaces = (A, B, r, idBase, color, fixedNormal) => {
        const dx = B.x - A.x, dy = B.y - A.y, dz = B.z - A.z;
        const segLen = Math.hypot(dx, dy, dz) || 1;
        const tg = { x: dx / segLen, y: dy / segLen, z: dz / segLen };
        let w1, w2;
        if (fixedNormal) {
            // normale de plan constante (arc d'un coude) : w2 fixe, w1 = w2×tg
            // varie en douceur avec la seule tangente — jamais de torsion
            // discontinue entre segments consécutifs de la courbe
            w2 = fixedNormal;
            const w1raw = { x: w2.y * tg.z - w2.z * tg.y, y: w2.z * tg.x - w2.x * tg.z, z: w2.x * tg.y - w2.y * tg.x };
            const w1len = Math.hypot(w1raw.x, w1raw.y, w1raw.z) || 1;
            w1 = { x: w1raw.x / w1len, y: w1raw.y / w1len, z: w1raw.z / w1len };
        }
        else {
            const seed = Math.abs(tg.z) > 0.9 ? { x: 1, y: 0, z: 0 } : { x: 0, y: 0, z: 1 };
            const dot = tg.x * seed.x + tg.y * seed.y + tg.z * seed.z;
            const w1u = { x: seed.x - dot * tg.x, y: seed.y - dot * tg.y, z: seed.z - dot * tg.z };
            const w1len = Math.hypot(w1u.x, w1u.y, w1u.z) || 1;
            w1 = { x: w1u.x / w1len, y: w1u.y / w1len, z: w1u.z / w1len };
            w2 = { x: tg.y * w1.z - tg.z * w1.y, y: tg.z * w1.x - tg.x * w1.z, z: tg.x * w1.y - tg.y * w1.x };
        }
        const ringPt = (center, i) => {
            const th = (i / N_SIDES) * Math.PI * 2;
            const c = Math.cos(th) * r, sn = Math.sin(th) * r;
            return { x: center.x + w1.x * c + w2.x * sn, y: center.y + w1.y * c + w2.y * sn, z: center.z + w1.z * c + w2.z * sn };
        };
        const out = [];
        for (let i = 0; i < N_SIDES; i++) {
            const pts = [ringPt(A, i), ringPt(A, i + 1), ringPt(B, i + 1), ringPt(B, i)].map(screenPt);
            out.push({ id: idBase + "_f" + i, pts, color, depth: (pts[0].depth + pts[2].depth) / 2,
                mid: { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2, z: (A.z + B.z) / 2 } });
        }
        return out;
    };
    const pipeShapes = [
        ...segments.flatMap((s) => {
            if (!s.dn)
                return [];
            const chain = resolved.segChains[s.id];
            if (!chain)
                return [];
            let trimmed = chain.map((p) => ({ ...p }));
            const cutA = roundedJoints[s.id + "_a"];
            if (cutA)
                trimmed[0] = cutA.cut;
            const cutB = roundedJoints[s.id + "_b"];
            if (cutB)
                trimmed[trimmed.length - 1] = cutB.cut;
            const r = s.dn / 200;
            // arrondit aussi le(s) coin(s) interne(s) d'une casse/double casse
            // (entre ses propres branches) — un vrai coude physique entre 2
            // tronçons droits distincts, pas un angle vif ni une diagonale unique
            if (trimmed.length > 2) {
                const rounded = [trimmed[0]];
                for (let i = 1; i < trimmed.length - 1; i++) {
                    const prev = rounded[rounded.length - 1], corner = trimmed[i], next = trimmed[i + 1];
                    const dInLen = Math.hypot(corner.x - prev.x, corner.y - prev.y, corner.z - prev.z) || 1;
                    const dIn = { x: (prev.x - corner.x) / dInLen, y: (prev.y - corner.y) / dInLen, z: (prev.z - corner.z) / dInLen };
                    const dOutLen = Math.hypot(next.x - corner.x, next.y - corner.y, next.z - corner.z) || 1;
                    const dOut = { x: (next.x - corner.x) / dOutLen, y: (next.y - corner.y) / dOutLen, z: (next.z - corner.z) / dOutLen };
                    const cr = Math.min(1.5 * s.dn / 100, dInLen * 0.9, dOutLen * 0.9);
                    if (cr < 0.02) {
                        rounded.push(corner);
                        continue;
                    }
                    const center = { x: corner.x - dIn.x * cr + dOut.x * cr, y: corner.y - dIn.y * cr + dOut.y * cr, z: corner.z - dIn.z * cr + dOut.z * cr };
                    rounded.push({ x: corner.x - dIn.x * cr, y: corner.y - dIn.y * cr, z: corner.z - dIn.z * cr });
                    for (let k = 1; k < 8; k++) {
                        const a = (k / 8) * (Math.PI / 2), ca = Math.cos(a), sa = Math.sin(a);
                        rounded.push({
                            x: center.x + cr * (-dOut.x * ca + dIn.x * sa),
                            y: center.y + cr * (-dOut.y * ca + dIn.y * sa),
                            z: center.z + cr * (-dOut.z * ca + dIn.z * sa),
                        });
                    }
                    rounded.push({ x: corner.x + dOut.x * cr, y: corner.y + dOut.y * cr, z: corner.z + dOut.z * cr });
                }
                rounded.push(trimmed[trimmed.length - 1]);
                trimmed = rounded;
            }
            const out = [];
            for (let i = 0; i < trimmed.length - 1; i++) {
                splitAgainstWalls(trimmed[i], trimmed[i + 1]).forEach(([A, B], j) => {
                    out.push(...cylinderFaces(A, B, r, s.id + "_pipe_" + i + "_" + j, s.color || COLORS.pipe));
                });
            }
            return out;
        }),
        ...Object.keys(roundedJoints).flatMap((k) => {
            if (!k.startsWith("__arc_"))
                return [];
            const j = roundedJoints[k];
            if (!j.dn)
                return [];
            const r = j.dn / 200;
            const out = [];
            for (let i = 0; i < j.pts.length - 1; i++) {
                splitAgainstWalls(j.pts[i], j.pts[i + 1]).forEach(([A, B], m) => {
                    out.push(...cylinderFaces(A, B, r, k + "_pipe_" + i + "_" + m, j.color || COLORS.pipe, j.planeNormal));
                });
            }
            return out;
        }),
    ].sort((a, b) => b.depth - a.depth);
    // anneaux matérialisant la fin réelle de chaque tronçon de tube — à
    // chaque coude (tangente du raccord arrondi) et à chaque accessoire qui
    // interrompt matériellement le tube (bride, vanne, etc.) ; le support
    // n'en fait pas partie : c'est une simple accroche, il ne coupe pas le tube
    const ringOutline = (center, axis, sign, r) => {
        const tg = typeof axis === "object" && axis !== null ? axis : { x: { x: 1, y: 0, z: 0 }, y: { x: 0, y: 1, z: 0 }, z: { x: 0, y: 0, z: 1 } }[axis];
        const seed = Math.abs(tg.z) > 0.9 ? { x: 1, y: 0, z: 0 } : { x: 0, y: 0, z: 1 };
        const dot = tg.x * seed.x + tg.y * seed.y + tg.z * seed.z;
        const w1u = { x: seed.x - dot * tg.x, y: seed.y - dot * tg.y, z: seed.z - dot * tg.z };
        const w1len = Math.hypot(w1u.x, w1u.y, w1u.z) || 1;
        const w1 = { x: w1u.x / w1len, y: w1u.y / w1len, z: w1u.z / w1len };
        const w2 = {
            x: tg.y * w1.z - tg.z * w1.y, y: tg.z * w1.x - tg.x * w1.z, z: tg.x * w1.y - tg.y * w1.x,
        };
        const pts = [];
        for (let i = 0; i <= N_SIDES; i++) {
            const th = (i / N_SIDES) * Math.PI * 2;
            const c = Math.cos(th) * r, sn = Math.sin(th) * r;
            pts.push(screenPt({ x: center.x + w1.x * c + w2.x * sn, y: center.y + w1.y * c + w2.y * sn, z: center.z + w1.z * c + w2.z * sn }));
        }
        return pts;
    };
    const endRings = [
        ...segments.flatMap((s) => {
            if (!s.dn)
                return [];
            const r = s.dn / 200;
            const out = [];
            const cutA = roundedJoints[s.id + "_a"];
            if (cutA) {
                const chain = resolved.segChains[s.id];
                const d = legAxis(chain[0], chain[1]);
                const pts = ringOutline(cutA.cut, d.axis, d.sign, r);
                out.push({ id: s.id + "_ringA", pts, mid: cutA.cut, depth: pts.reduce((a, p) => a + p.depth, 0) / pts.length });
            }
            const cutB = roundedJoints[s.id + "_b"];
            if (cutB) {
                const chain = resolved.segChains[s.id];
                const last = chain.length - 1;
                const d = legAxis(chain[last], chain[last - 1]);
                const pts = ringOutline(cutB.cut, d.axis, d.sign, r);
                out.push({ id: s.id + "_ringB", pts, mid: cutB.cut, depth: pts.reduce((a, p) => a + p.depth, 0) / pts.length });
            }
            return out;
        }),
        ...fittings
            .filter((f) => !STRUCTURE_TYPES.includes(f.type) && f.type !== "texte" && f.type !== "support" && f.segId !== undefined)
            .flatMap((f) => {
            const s = segments.find((x) => x.id === f.segId);
            const chain = resolved.segChains[f.segId];
            if (!s || !s.dn || !chain)
                return [];
            const pos = pointAtT(chain, f.t);
            const { axis, sign } = dirAtT(chain, f.t, s);
            const pts = ringOutline(pos, axis, sign, s.dn / 200);
            return [{ id: f.id + "_ring", pts, mid: pos, depth: pts.reduce((a, p) => a + p.depth, 0) / pts.length }];
        }),
    ].sort((a, b) => b.depth - a.depth);
    // ---- Murs 3D (génération 3D uniquement, indépendante du dessin ISO) ----
    // épaisseur = la plus petite des 3 dimensions du pavé, déterminée
    // dynamiquement (pas figée à la création) : si l'utilisateur redimensionne
    // le mur, l'axe "épaisseur" peut changer naturellement, sans réglage dédié
    // grille de référence 3D (plan horizontal X-Y, au niveau du bas du tracé)
    // — dimensionnée sur l'étendue réelle du tracé et des murs, avec un pas
    // identique à celui utilisé pour l'accrochage des murs (cohérence visuelle)
    const grid3DLines = (() => {
        if (!showGrid3D)
            return [];
        const pts = Object.values(resolved.posMap || {});
        const allX = [...pts.map((p) => p.x), ...walls3D.flatMap((w) => [w.x0, w.x1])];
        const allY = [...pts.map((p) => p.y), ...walls3D.flatMap((w) => [w.y0, w.y1])];
        const allZ = [...pts.map((p) => p.z), ...walls3D.flatMap((w) => [w.z0, w.z1])];
        if (!allX.length)
            return [];
        const pad = 15;
        const s = GRID_STEP_3D;
        const minX = Math.floor((Math.min(...allX) - pad) / s) * s;
        const maxX = Math.ceil((Math.max(...allX) + pad) / s) * s;
        const minY = Math.floor((Math.min(...allY) - pad) / s) * s;
        const maxY = Math.ceil((Math.max(...allY) + pad) / s) * s;
        const z0 = Math.min(...allZ);
        const lines = [];
        // vrai plan de sol : chaque ligne est découpée en morceaux pour pouvoir
        // passer correctement derrière les murs, et les lignes tous les 5 pas
        // sont renforcées pour donner une lecture d'échelle (repère type CAO)
        const pushSplit = (A, B, strong) => {
            splitAgainstWalls(A, B).forEach(([P, Q]) => {
                lines.push({
                    a: screenPt(P), b: screenPt(Q), strong,
                    mid: { x: (P.x + Q.x) / 2, y: (P.y + Q.y) / 2, z: (P.z + Q.z) / 2 },
                });
            });
        };
        for (let gx = minX; gx <= maxX; gx += s) {
            pushSplit({ x: gx, y: minY, z: z0 }, { x: gx, y: maxY, z: z0 }, Math.round(gx / s) % 5 === 0);
        }
        for (let gy = minY; gy <= maxY; gy += s) {
            pushSplit({ x: minX, y: gy, z: z0 }, { x: maxX, y: gy, z: z0 }, Math.round(gy / s) % 5 === 0);
        }
        return lines;
    })();
    // pour une porte, le bord bas est TOUJOURS ancré au sol du mur (jamais
    // stocké tel quel) — évite toute dérive possible entre la création, le
    // découpage des faces et le glissement des poignées
    const doorAnchored = (t, g) => {
        if (!t.door)
            return t;
        return { ...t, c2: g.lo[g.axes[1]] + t.h2 };
    };
    const wallGeom = walls3D.map((w) => {
        const lo = { x: Math.min(w.x0, w.x1), y: Math.min(w.y0, w.y1), z: Math.min(w.z0, w.z1) };
        const hi = { x: Math.max(w.x0, w.x1), y: Math.max(w.y0, w.y1), z: Math.max(w.z0, w.z1) };
        const span = { x: hi.x - lo.x, y: hi.y - lo.y, z: hi.z - lo.z };
        const thinAxis = span.x <= span.y && span.x <= span.z ? "x" : span.y <= span.z ? "y" : "z";
        const axes = ["x", "y", "z"].filter((a) => a !== thinAxis);
        const mid = { x: (lo.x + hi.x) / 2, y: (lo.y + hi.y) / 2, z: (lo.z + hi.z) / 2 };
        return { w, lo, hi, span, thinAxis, axes, mid };
    });
    // détection auto des tremies : pour chaque mur, cherche les tronçons dont
    // la chaîne résolue traverse le plan médian de l'épaisseur du mur, dans
    // l'emprise du mur sur les 2 autres axes — crée/actualise une tremie AUTO
    // par tronçon concerné, sauf si l'utilisateur l'a déjà ajustée à la main
    useEffect(() => {
        if (!walls3D.length)
            return;
        let changed = false;
        const next = walls3D.map((w) => {
            const lo = { x: Math.min(w.x0, w.x1), y: Math.min(w.y0, w.y1), z: Math.min(w.z0, w.z1) };
            const hi = { x: Math.max(w.x0, w.x1), y: Math.max(w.y0, w.y1), z: Math.max(w.z0, w.z1) };
            const span = { x: hi.x - lo.x, y: hi.y - lo.y, z: hi.z - lo.z };
            const thinAxis = span.x <= span.y && span.x <= span.z ? "x" : span.y <= span.z ? "y" : "z";
            const axes = ["x", "y", "z"].filter((a) => a !== thinAxis);
            const mid = { x: (lo.x + hi.x) / 2, y: (lo.y + hi.y) / 2, z: (lo.z + hi.z) / 2 };
            const foundSegIds = new Set();
            const autoTremies = [];
            segments.forEach((s) => {
                if (!s.dn || foundSegIds.has(s.id))
                    return;
                const chain = resolved.segChains[s.id];
                if (!chain)
                    return;
                for (let i = 0; i < chain.length - 1; i++) {
                    const A = chain[i], B = chain[i + 1];
                    const denom = B[thinAxis] - A[thinAxis];
                    if (Math.abs(denom) < 1e-9)
                        continue;
                    const t = (mid[thinAxis] - A[thinAxis]) / denom;
                    if (t < 0 || t > 1)
                        continue;
                    const cross = {
                        x: A.x + (B.x - A.x) * t, y: A.y + (B.y - A.y) * t, z: A.z + (B.z - A.z) * t,
                    };
                    if (cross[axes[0]] < lo[axes[0]] || cross[axes[0]] > hi[axes[0]])
                        continue;
                    if (cross[axes[1]] < lo[axes[1]] || cross[axes[1]] > hi[axes[1]])
                        continue;
                    foundSegIds.add(s.id);
                    const clearance = Math.max(0.3, (s.dn / 100) * 0.6);
                    autoTremies.push({
                        segId: s.id, manual: false,
                        c1: cross[axes[0]], c2: cross[axes[1]],
                        h1: s.dn / 200 + clearance, h2: s.dn / 200 + clearance,
                    });
                    break;
                }
            });
            const kept = (w.tremies || []).filter((t) => t.manual || (t.segId && foundSegIds.has(t.segId)));
            const keptSegIds = new Set(kept.map((t) => t.segId));
            const merged = [...kept, ...autoTremies.filter((t) => !keptSegIds.has(t.segId))];
            if (JSON.stringify(merged) !== JSON.stringify(w.tremies || []))
                changed = true;
            return changed ? { ...w, tremies: merged } : w;
        });
        if (changed)
            setWalls3D(next);
    }, [segments, resolved, walls3D]);
    // faces du pavé (6), en écran ; les 2 faces "traversantes" (perpendiculaires
    // à l'axe épaisseur) sont découpées avec un trou par trémie via un <path>
    // SVG à deux sous-tracés de sens opposés (technique standard "trou")
    // direction de vue (monde), dérivée de la même formule que project() —
    // permet un masquage de faces arrière fiable, bien plus robuste qu'un tri
    // par profondeur moyenne des coins pour un pavé plein comme un mur
    const viewDir3D = qRotateVec(qConj(camQuat), { x: 0, y: 0, z: -1 });
    const FACE_NORMAL = { x: { x: 1, y: 0, z: 0 }, y: { x: 0, y: 1, z: 0 }, z: { x: 0, y: 0, z: 1 } };
    const isFrontFacing = (nx, ny, nz) => nx * viewDir3D.x + ny * viewDir3D.y + nz * viewDir3D.z < 0.03;
    // occultation exacte par les murs : depuis un point, on remonte le rayon
    // vers la caméra ; s'il traverse le volume plein d'un mur (hors trémie),
    // le point est réellement caché. C'est un test géométrique, contrairement
    // au tri par profondeur moyenne qui ne peut pas comparer correctement un
    // petit segment de tracé à une grande face de mur.
    const isHiddenByWall = (P) => {
        if (!P || !wallGeom.length)
            return false;
        const FAR = 10000;
        const Q = {
            x: P.x - viewDir3D.x * FAR, y: P.y - viewDir3D.y * FAR, z: P.z - viewDir3D.z * FAR,
        };
        for (const g of wallGeom) {
            const t = raySlabT(P, Q, g.w);
            if (!t)
                continue;
            if (t[1] <= 1e-6)
                continue; // le mur est derrière le point, pas devant
            const tin = Math.max(t[0], 1e-6);
            if (tin > 1)
                continue;
            const hit = {
                x: P.x + (Q.x - P.x) * tin, y: P.y + (Q.y - P.y) * tin, z: P.z + (Q.z - P.z) * tin,
            };
            // si le rayon entre par une trémie, il passe au travers : pas d'occultation
            const inTremie = (g.w.tremies || []).some((tr0) => {
                const tr = doorAnchored(tr0, g);
                return Math.abs(hit[g.axes[0]] - tr.c1) <= tr.h1 && Math.abs(hit[g.axes[1]] - tr.c2) <= tr.h2;
            });
            if (inTremie)
                continue;
            return true;
        }
        return false;
    };
    // rang d'occultation : nombre d'AUTRES murs (hors excludeWallId, le mur
    // propriétaire du point testé) qui cachent réellement ce point depuis la
    // caméra. Sert à trier TOUT (tuyaux ET murs entre eux) sans jamais comparer
    // deux profondeurs moyennes — la faille qui faisait "fondre" un petit mur
    // dans un grand ou clignoter les arêtes selon l'angle.
    //
    // Deux pistes de correction testées et abandonnées pour la vue ISO qui
    // "avale" un tuyau derrière un mur lointain (voir échanges du 12/08) :
    // 1) exiger un recouvrement de plan + tolérance sur l'épaisseur du mur —
    //    cassait l'occultation normale d'une pièce fermée simple (le mur se
    //    trouve à une distance du même ordre de grandeur dans les 2 cas, un
    //    seuil fixe ne peut pas les distinguer, testé et confirmé) ;
    // 2) exiger un consensus sur plusieurs rayons légèrement perturbés autour
    //    de la direction de vue exacte — même en poussant la perturbation à
    //    ~45° l'occultation restait majoritaire (testé jusqu'à epsilon=0.8),
    //    ce n'est donc pas un effleurement de coïncidence sur un seul angle
    //    précis mais une occultation réellement stable sur une large plage
    //    d'angles. Le mur en question s'avère en outre former, avec un autre
    //    mur adjacent, une bande continue jusqu'à la même limite qu'un 3e mur
    //    du même groupe (probablement une paroi avant partielle avec porte,
    //    pas un plafond isolé) : le rayon a de bonnes raisons géométriques de
    //    le traverser. Un vrai correctif demanderait de revoir la géométrie
    //    murs/porte du projet, pas l'algorithme d'occultation lui-même.
    const occlusionRank = (P, excludeWallId) => {
        if (!P || !wallGeom.length)
            return 0;
        let rank = 0;
        const FAR = 10000;
        const Q = { x: P.x - viewDir3D.x * FAR, y: P.y - viewDir3D.y * FAR, z: P.z - viewDir3D.z * FAR };
        for (const g of wallGeom) {
            if (g.w.id === excludeWallId)
                continue;
            const t = raySlabT(P, Q, g.w);
            if (!t || t[1] <= 1e-6)
                continue;
            const tin = Math.max(t[0], 1e-6);
            if (tin > 1)
                continue;
            // occultation FRANCHE seulement : le rayon de vue doit traverser une
            // épaisseur significative du volume du mur, pas juste effleurer une
            // arête/un coin. Sur une vue iso, la diagonale de vue peut frôler le
            // coin d'un mur latéral situé À CÔTÉ du tube (pas devant lui) — le
            // point d'entrée est alors sur l'arête et la longueur traversée dans
            // le mur est quasi nulle. Ça masquait le tube pour un pouième de
            // recouvrement, et basculait au moindre degré de rotation (le tube
            // "clignotait"). On mesure la corde réelle traversée dans le mur
            // (en distance monde) et on exige qu'elle atteigne au moins la
            // moitié de la plus petite épaisseur du mur : un vrai passage
            // derrière le mur la dépasse toujours ; un effleurement d'arête non.
            const tout = Math.min(t[1], 1);
            const chord = (tout - tin) * FAR; // longueur monde traversée dans le mur
            const thinExtent = g.hi[g.thinAxis] - g.lo[g.thinAxis];
            if (chord < 0.5 * thinExtent)
                continue;
            const hit = { x: P.x + (Q.x - P.x) * tin, y: P.y + (Q.y - P.y) * tin, z: P.z + (Q.z - P.z) * tin };
            const inTremie = (g.w.tremies || []).some((tr0) => {
                const tr = doorAnchored(tr0, g);
                return Math.abs(hit[g.axes[0]] - tr.c1) <= tr.h1 && Math.abs(hit[g.axes[1]] - tr.c2) <= tr.h2;
            });
            if (inTremie)
                continue;
            rank++;
        }
        return rank;
    };
    if (window.__V3D_DEBUG_ENABLED) {
        window.__whichWalls = (P) => {
            const FAR = 10000;
            const Q = { x: P.x - viewDir3D.x * FAR, y: P.y - viewDir3D.y * FAR, z: P.z - viewDir3D.z * FAR };
            const out = [];
            for (const g of wallGeom) {
                const t = raySlabT(P, Q, g.w);
                if (!t || t[1] <= 1e-6) continue;
                const tin = Math.max(t[0], 1e-6);
                if (tin > 1) continue;
                const tout = Math.min(t[1], 1);
                const hit = { x: P.x + (Q.x - P.x) * tin, y: P.y + (Q.y - P.y) * tin, z: P.z + (Q.z - P.z) * tin };
                const hitOut = { x: P.x + (Q.x - P.x) * tout, y: P.y + (Q.y - P.y) * tout, z: P.z + (Q.z - P.z) * tout };
                const ta = g.thinAxis;
                // face d'entrée : sur quel côté du thinAxis le rayon entre-t-il ?
                const entryLo = Math.abs(hit[ta] - g.lo[ta]) < Math.abs(hit[ta] - g.hi[ta]);
                const exitLo = Math.abs(hitOut[ta] - g.lo[ta]) < Math.abs(hitOut[ta] - g.hi[ta]);
                // normale extérieure de la face d'entrée / sortie
                const nEntry = { x: 0, y: 0, z: 0 }; nEntry[ta] = entryLo ? -1 : 1;
                const nExit = { x: 0, y: 0, z: 0 }; nExit[ta] = exitLo ? -1 : 1;
                out.push({ wallId: g.w.id.slice(-5), thinAxis: ta,
                    entryFace: entryLo ? 'lo' : 'hi', exitFace: exitLo ? 'lo' : 'hi',
                    entryFrontFacing: isFrontFacing(nEntry.x, nEntry.y, nEntry.z),
                    exitFrontFacing: isFrontFacing(nExit.x, nExit.y, nExit.z),
                    hit:{x:+hit.x.toFixed(1),y:+hit.y.toFixed(1),z:+hit.z.toFixed(1)},
                    tin:+tin.toFixed(4), tout:+tout.toFixed(4),
                    pDepth:+project(P).depth.toFixed(2), hitDepth:+project(hit).depth.toFixed(2) });
            }
            return out;
        };
        // rang détaillé par mur — quel(s) mur(s) précisément comptent pour un
        // point donné, en échantillonnant plusieurs rayons légèrement
        // perturbés (diagnostic seulement — n'affecte plus le rendu réel,
        // cf. notes sur occlusionRank ci-dessus)
        const normalize3 = (v) => {
            const l = Math.hypot(v.x, v.y, v.z) || 1;
            return { x: v.x / l, y: v.y / l, z: v.z / l };
        };
        window.__occlusionRankDetail = (P) => {
            const FAR = 10000, eps = 0.06;
            const dirs = [
                viewDir3D,
                normalize3({ x: viewDir3D.x + eps, y: viewDir3D.y, z: viewDir3D.z }),
                normalize3({ x: viewDir3D.x - eps, y: viewDir3D.y, z: viewDir3D.z }),
                normalize3({ x: viewDir3D.x, y: viewDir3D.y + eps, z: viewDir3D.z }),
                normalize3({ x: viewDir3D.x, y: viewDir3D.y - eps, z: viewDir3D.z }),
                normalize3({ x: viewDir3D.x, y: viewDir3D.y, z: viewDir3D.z + eps }),
                normalize3({ x: viewDir3D.x, y: viewDir3D.y, z: viewDir3D.z - eps }),
            ];
            const out = [];
            wallGeom.forEach((g) => {
                let hits = 0;
                let mainHit = null;
                dirs.forEach((dir, i) => {
                    const Q = { x: P.x - dir.x * FAR, y: P.y - dir.y * FAR, z: P.z - dir.z * FAR };
                    const t = raySlabT(P, Q, g.w);
                    if (!t || t[1] <= 1e-6)
                        return;
                    const tin = Math.max(t[0], 1e-6);
                    if (tin > 1)
                        return;
                    const hit = { x: P.x + (Q.x - P.x) * tin, y: P.y + (Q.y - P.y) * tin, z: P.z + (Q.z - P.z) * tin };
                    const inTremie = (g.w.tremies || []).some((tr0) => {
                        const tr = doorAnchored(tr0, g);
                        return Math.abs(hit[g.axes[0]] - tr.c1) <= tr.h1 && Math.abs(hit[g.axes[1]] - tr.c2) <= tr.h2;
                    });
                    if (!inTremie) {
                        hits++;
                        if (i === 0)
                            mainHit = hit;
                    }
                });
                if (hits > 0 || mainHit)
                    out.push({ wallId: g.w.id, hits, totalDirs: dirs.length, mainHit, countedRobust: hits > dirs.length / 2 });
            });
            return out;
        };
        window.__viewDir3D = viewDir3D;
    }
    const wallShapes = wallGeom.map(({ w, lo, hi, thinAxis, axes }) => {
        const corner = (a1v, a2v, thinV) => {
            const p = {};
            p[axes[0]] = a1v;
            p[axes[1]] = a2v;
            p[thinAxis] = thinV;
            return { x: p.x, y: p.y, z: p.z };
        };
        const faces = [];
        // 2 faces traversantes (avant/arrière selon l'axe épaisseur) — ne garde
        // que celle qui fait face à la caméra (l'autre est forcément cachée)
        const nThin = FACE_NORMAL[thinAxis];
        [[lo[thinAxis], -1], [hi[thinAxis], 1]].forEach(([thinV, sign], fi) => {
            if (!isFrontFacing(nThin.x * sign, nThin.y * sign, nThin.z * sign))
                return;
            const midCheck = corner((lo[axes[0]] + hi[axes[0]]) / 2, (lo[axes[1]] + hi[axes[1]]) / 2, thinV);
            if (isFaceBuried(midCheck, w.id, w.groupId, thinAxis, sign))
                return;
            const outer = [
                corner(lo[axes[0]], lo[axes[1]], thinV), corner(hi[axes[0]], lo[axes[1]], thinV),
                corner(hi[axes[0]], hi[axes[1]], thinV), corner(lo[axes[0]], hi[axes[1]], thinV),
            ].map(screenPt);
            const holes = (w.tremies || []).map((t0) => {
                const t = doorAnchored(t0, { lo, axes });
                return [
                    corner(t.c1 - t.h1, t.c2 - t.h2, thinV), corner(t.c1 - t.h1, t.c2 + t.h2, thinV),
                    corner(t.c1 + t.h1, t.c2 + t.h2, thinV), corner(t.c1 + t.h1, t.c2 - t.h2, thinV),
                ].map(screenPt).reverse();
            });
            const depth = outer.reduce((a, p) => a + p.depth, 0) / outer.length;
            const mid = corner((lo[axes[0]] + hi[axes[0]]) / 2, (lo[axes[1]] + hi[axes[1]]) / 2, thinV);
            faces.push({ id: w.id + "_face_thin" + fi, outer, holes, depth, mid, wallId: w.id, groupId: w.groupId });
        });
        // 4 faces périphériques (cadre autour de l'épaisseur) — idem, seules les
        // faces avant sont gardées (au plus 2 des 4 sont visibles à la fois)
        const perim = [
            [lo[axes[0]], lo[axes[1]], lo[axes[0]], hi[axes[1]], FACE_NORMAL[axes[0]], -1],
            [hi[axes[0]], lo[axes[1]], hi[axes[0]], hi[axes[1]], FACE_NORMAL[axes[0]], 1],
            [lo[axes[0]], lo[axes[1]], hi[axes[0]], lo[axes[1]], FACE_NORMAL[axes[1]], -1],
            [lo[axes[0]], hi[axes[1]], hi[axes[0]], hi[axes[1]], FACE_NORMAL[axes[1]], 1],
        ];
        perim.forEach(([x1, y1, x2, y2, n, sign], pi) => {
            if (!isFrontFacing(n.x * sign, n.y * sign, n.z * sign))
                return;
            const fixedAxis = x1 === x2 ? axes[0] : axes[1];
            const midCheck = corner((x1 + x2) / 2, (y1 + y2) / 2, (lo[thinAxis] + hi[thinAxis]) / 2);
            if (isFaceBuried(midCheck, w.id, w.groupId, fixedAxis, sign))
                return;
            const outer = [
                corner(x1, y1, lo[thinAxis]), corner(x2, y2, lo[thinAxis]),
                corner(x2, y2, hi[thinAxis]), corner(x1, y1, hi[thinAxis]),
            ].map(screenPt);
            const depth = outer.reduce((a, p) => a + p.depth, 0) / outer.length;
            const mid = corner((x1 + x2) / 2, (y1 + y2) / 2, (lo[thinAxis] + hi[thinAxis]) / 2);
            faces.push({ id: w.id + "_face_perim" + pi, outer, holes: [], depth, mid, wallId: w.id, groupId: w.groupId });
        });
        return { wallId: w.id, faces };
    });
    // occultation ÉCRAN par faces de mur pleines : combien de faces dessinées
    // (front-facing, hors trémie) recouvrent réellement un point écran avec une
    // profondeur INTERPOLÉE plus proche de la caméra. C'est la vérité visuelle
    // exacte au pixel, contrairement au rang par rayon (qui compte des murs de
    // biais) ou à la profondeur moyenne de face (qui compare mal un fin trait à
    // une grande face inclinée). Sert à masquer proprement : un tuyau/une arête
    // n'est caché que par ce qui est réellement dessiné devant lui à son pixel.
    // `excludeWallId` : ne pas se compter soi-même (une arête arrière d'un mur
    // est traitée par sa propre face avant via un test dédié, pas par ici).
    const wallFacesFlat = [];
    wallShapes.forEach((ws) => ws.faces.forEach((f) => wallFacesFlat.push(f)));
    const spInPoly = (pt, poly) => {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
            if (((yi > pt.y) !== (yj > pt.y)) && (pt.x < ((xj - xi) * (pt.y - yi)) / (yj - yi) + xi))
                inside = !inside;
        }
        return inside;
    };
    const spTriDepth = (pt, a, b, c) => {
        const d = (b.y - c.y) * (a.x - c.x) + (c.x - b.x) * (a.y - c.y);
        if (Math.abs(d) < 1e-9)
            return null;
        const wa = ((b.y - c.y) * (pt.x - c.x) + (c.x - b.x) * (pt.y - c.y)) / d;
        const wb = ((c.y - a.y) * (pt.x - c.x) + (a.x - c.x) * (pt.y - c.y)) / d;
        const wc = 1 - wa - wb;
        if (wa < -0.01 || wb < -0.01 || wc < -0.01)
            return null;
        return wa * a.depth + wb * b.depth + wc * c.depth;
    };
    const spFaceDepth = (pt, q) => {
        let d = spTriDepth(pt, q[0], q[1], q[2]);
        if (d == null)
            d = spTriDepth(pt, q[0], q[2], q[3]);
        return d;
    };
    // nombre de faces de mur qui recouvrent VRAIMENT le point écran sp, devant lui.
    // marge de profondeur (marginDepth) : un point pile sur une face (arête sur
    // sa propre face, tuyau collé au mur) ne doit pas se masquer lui-même — on
    // exige que la face soit devant d'au moins cette marge.
    const wallScreenCoverCount = (sp, excludeWallId, marginDepth) => {
        const md = marginDepth || 0.01;
        let n = 0;
        for (const f of wallFacesFlat) {
            if (excludeWallId != null && f.wallId === excludeWallId)
                continue;
            if (!spInPoly(sp, f.outer))
                continue;
            if ((f.holes || []).some((h) => spInPoly(sp, h)))
                continue;
            const fd = spFaceDepth(sp, f.outer);
            const fdHere = fd != null ? fd : f.depth;
            if (fdHere < sp.depth - md)
                n++;
        }
        return n;
    };
    if (window.__V3D_DEBUG_ENABLED) {
        window.__screenCover = (P) => {
            const sp = screenPt(P);
            const out = [];
            wallFacesFlat.forEach((f) => {
                if (!spInPoly(sp, f.outer)) return;
                if ((f.holes || []).some((h) => spInPoly(sp, h))) return;
                const fd = spFaceDepth(sp, f.outer);
                out.push({ wallId: f.wallId.slice(-5), faceId: f.id.slice(-14), faceDepthHere: fd != null ? +fd.toFixed(2) : null, tubeDepth: +sp.depth.toFixed(2), covers: (fd != null ? fd : f.depth) < sp.depth - 0.01 });
            });
            return out;
        };
        window.__wallScreenCoverCount = (P, ex) => wallScreenCoverCount(screenPt(P), ex);
    }
    // direction écran par unité de chaque axe monde (translation pure : la
    // projection iso est affine, donc cette direction est constante partout)
    const origin0 = screenPt({ x: 0, y: 0, z: 0 });
    const AXIS_SCREEN = {
        x: { x: screenPt({ x: 1, y: 0, z: 0 }).x - origin0.x, y: screenPt({ x: 1, y: 0, z: 0 }).y - origin0.y },
        y: { x: screenPt({ x: 0, y: 1, z: 0 }).x - origin0.x, y: screenPt({ x: 0, y: 1, z: 0 }).y - origin0.y },
        z: { x: screenPt({ x: 0, y: 0, z: 1 }).x - origin0.x, y: screenPt({ x: 0, y: 0, z: 1 }).y - origin0.y },
    };
    // poignées du mur sélectionné : 6 milieux de face (redimensionnement
    // indépendant par axe) + 4 bords par trémie existante
    const selectedWallHandles = (() => {
        const g = wallGeom.find((x) => x.w.id === selectedWallId);
        if (!g)
            return [];
        const { w, lo, hi, mid, axes } = g;
        const out = [];
        const AXIS_COLOR = { x: "#D32F2F", y: "#2E7D32", z: "#1565C0" };
        const offset = Math.max(6, Math.min(w.x1 - w.x0, w.y1 - w.y0, w.z1 - w.z0 || 1e9) * 0.5 + 4);
        ["x", "y", "z"].forEach((ax) => {
            const p = { ...mid };
            p[ax] = mid[ax] + offset;
            out.push({ kind: "moveAxis", wallId: w.id, axis: ax, color: AXIS_COLOR[ax], screen: screenPt(p) });
        });
        ["x", "y", "z"].forEach((ax) => {
            const other = ["x", "y", "z"].filter((a) => a !== ax);
            [["min", lo[ax]], ["max", hi[ax]]].forEach(([which, val]) => {
                const p = {};
                p[ax] = val;
                p[other[0]] = mid[other[0]];
                p[other[1]] = mid[other[1]];
                out.push({ kind: "wall", wallId: w.id, axis: ax, which, screen: screenPt(p) });
            });
        });
        (w.tremies || []).forEach((t0, ti) => {
            const t = doorAnchored(t0, g);
            [["min", "c1", "h1"], ["max", "c1", "h1"], ["min", "c2", "h2"], ["max", "c2", "h2"]].forEach(([which, ck, hk]) => {
                if (t0.door && ck === "c2" && which === "min")
                    return; // bas de porte fixé au sol
                const p = {};
                const edgeVal = which === "min" ? t[ck] - t[hk] : t[ck] + t[hk];
                const otherK = ck === "c1" ? "c2" : "c1";
                p[axes[ck === "c1" ? 0 : 1]] = edgeVal;
                p[axes[otherK === "c1" ? 0 : 1]] = t[otherK];
                p[g.thinAxis] = mid[g.thinAxis];
                out.push({ kind: "tremie", wallId: w.id, tremieIdx: ti, field: ck, which, isDoor: !!t0.door, screen: screenPt(p) });
            });
        });
        return out;
    })();
    if (window.__V3D_DEBUG_ENABLED)
        window.__v3dWallHandles = selectedWallHandles;
    // diagnostic : les 2 triangles du double casse, superposés en
    // transparence pour comparer avec le tracé officiel. Reconstruits en
    // vrai volume 3D à partir de la même interprétation élévation+plan que
    // le tracé officiel (et non depuis les points bruts du croquis, qui
    // sont toujours à z=0 donc plats sous n'importe quel angle de vue 3D,
    // même quand le dessin ISO d'origine donne l'illusion du volume grâce à
    // sa projection fixe) — ancrés sur la vraie position reconstruite de A.
    const ghostTriangles = segments.flatMap((s) => {
        const A = nodes[s.a], B = nodes[s.b];
        const Ar = resolved.posMap[s.a];
        if (!A || !B || !Ar)
            return [];
        if (s.casse && s.casse.corner) {
            // casse simple : 1 seul triangle de référence (2 côtés), reconstruit
            // en vrai volume 3D à partir des mêmes vecteurs que le tracé officiel
            const legs = rawLegsOf(s);
            const M = applyLeg(Ar, legs[0].axis, legs[0].sign, legs[0].len);
            const Br = applyLeg(M, legs[1].axis, legs[1].sign, legs[1].len);
            return [{ id: s.id + "_ghost", pts: [Ar, M, Br].map(screenPt) }];
        }
        if (!s.doubleCasse)
            return [];
        const legs = rawLegsOf(s);
        if (legs.length === 3) {
            // détection élévation+plan réussie : [Z, horiz1, horiz2]
            const M1 = applyLeg(Ar, legs[0].axis, legs[0].sign, legs[0].len);
            const M2 = applyLeg(M1, legs[1].axis, legs[1].sign, legs[1].len);
            const Br = applyLeg(M2, legs[2].axis, legs[2].sign, legs[2].len);
            return [
                { id: s.id + "_ghost1", pts: [Ar, M1, Br].map(screenPt) },
                { id: s.id + "_ghost2", pts: [M1, M2, Br].map(screenPt) },
            ];
        }
        // repli : pas de relation pythagoricienne claire → affichage des
        // points bruts du croquis, translatés pour recoller au bon endroit
        const { mid, tri1, tri2 } = s.doubleCasse;
        const off = { x: Ar.x - A.x, y: Ar.y - A.y, z: Ar.z - A.z };
        const shift = (p) => ({ x: p.x + off.x, y: p.y + off.y, z: p.z + off.z });
        return [
            { id: s.id + "_ghost1", pts: [A, tri1.corner, mid].map(shift).map(screenPt) },
            { id: s.id + "_ghost2", pts: [mid, tri2.corner, B].map(shift).map(screenPt) },
        ];
    });
    // bibliothèque de formes 3D par type — coordonnées locales (t = le long
    // du tube, w = perpendiculaire) converties en points monde puis projetées ;
    // dir = "wing up" sauf sur un tube vertical où l'on bascule sur X, pour
    // toujours avoir une orientation lisible depuis n'importe quel angle
    // --- rendu "plein" des accessoires (brides/vannes/bobines) : mêmes
    // principes que les tubes (facettes + profondeur pour l'empilement),
    // avec en plus un léger ombrage par face (loi de Lambert simplifiée,
    // plancher ambiant pour ne jamais aller au noir) qui donne un vrai
    // rendu de volume plutôt que des symboles plats
    const FIT_LIGHT_DIR = (() => {
        const v = { x: -0.35, y: -0.55, z: 0.75 };
        const l = Math.hypot(v.x, v.y, v.z);
        return { x: v.x / l, y: v.y / l, z: v.z / l };
    })();
    const hexToRgb = (hex) => {
        const h = hex.replace("#", "");
        return { r: parseInt(h.substr(0, 2), 16), g: parseInt(h.substr(2, 2), 16), b: parseInt(h.substr(4, 2), 16) };
    };
    const rgbToHex = (r, g, b) => "#" + [r, g, b].map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
    const shadeColor = (hex, factor) => {
        const { r, g, b } = hexToRgb(hex);
        return rgbToHex(r * factor, g * factor, b * factor);
    };
    const faceShade = (normal, baseColor) => {
        const nl = Math.hypot(normal.x, normal.y, normal.z) || 1;
        const ndotl = (normal.x * FIT_LIGHT_DIR.x + normal.y * FIT_LIGHT_DIR.y + normal.z * FIT_LIGHT_DIR.z) / nl;
        const factor = 0.66 + 0.55 * ndotl;
        return shadeColor(baseColor, Math.max(0.42, Math.min(1.3, factor)));
    };
    // solide "disque/cylindre court" générique, axe quelconque — sert aussi
    // bien aux brides et corps de vannes (axe = tangente du tube) qu'aux
    // volants/leviers (axe = tige perpendiculaire) ; retourne des faces déjà
    // ombrées, prêtes à être projetées comme n'importe quelle primitive "poly"
    const N_FIT = 8;
    const discSolid = (center, axisDir, radius, halfThick, color, sides, caps) => {
        const al = Math.hypot(axisDir.x, axisDir.y, axisDir.z) || 1;
        const ax = { x: axisDir.x / al, y: axisDir.y / al, z: axisDir.z / al };
        const seed = Math.abs(ax.z) > 0.9 ? { x: 1, y: 0, z: 0 } : { x: 0, y: 0, z: 1 };
        const d = ax.x * seed.x + ax.y * seed.y + ax.z * seed.z;
        const p1u = { x: seed.x - d * ax.x, y: seed.y - d * ax.y, z: seed.z - d * ax.z };
        const p1l = Math.hypot(p1u.x, p1u.y, p1u.z) || 1;
        const perp1 = { x: p1u.x / p1l, y: p1u.y / p1l, z: p1u.z / p1l };
        const perp2 = {
            x: ax.y * perp1.z - ax.z * perp1.y, y: ax.z * perp1.x - ax.x * perp1.z, z: ax.x * perp1.y - ax.y * perp1.x,
        };
        const ring = (along, r, i, s) => {
            const th = (i / s) * Math.PI * 2, c = Math.cos(th) * r, sn = Math.sin(th) * r;
            return {
                x: center.x + ax.x * along + perp1.x * c + perp2.x * sn,
                y: center.y + ax.y * along + perp1.y * c + perp2.y * sn,
                z: center.z + ax.z * along + perp1.z * c + perp2.z * sn,
            };
        };
        const s = sides || N_FIT;
        const out = [];
        for (let i = 0; i < s; i++) {
            const a0 = (i / s) * Math.PI * 2, a1 = ((i + 1) / s) * Math.PI * 2, am = (a0 + a1) / 2;
            const nx = Math.cos(am), ny = Math.sin(am);
            const normal = { x: perp1.x * nx + perp2.x * ny, y: perp1.y * nx + perp2.y * ny, z: perp1.z * nx + perp2.z * ny };
            out.push({ kind: "poly", pts: [ring(-halfThick, radius, i, s), ring(-halfThick, radius, i + 1, s), ring(halfThick, radius, i + 1, s), ring(halfThick, radius, i, s)], fill: faceShade(normal, color) });
        }
        if (caps !== false) {
            const ptsF = [];
            for (let i = 0; i < s; i++)
                ptsF.push(ring(halfThick, radius, i, s));
            out.push({ kind: "poly", pts: ptsF, fill: faceShade(ax, color) });
            const ptsB = [];
            for (let i = s; i > 0; i--)
                ptsB.push(ring(-halfThick, radius, i - 1, s));
            out.push({ kind: "poly", pts: ptsB, fill: faceShade({ x: -ax.x, y: -ax.y, z: -ax.z }, color) });
        }
        return out;
    };
    // tronc de cône (réduction, corps de clapet effilé) — mêmes principes que
    // discSolid mais rayon différent à chaque extrémité
    const coneSolid = (center, axisDir, rNear, rFar, halfThick, color, sides) => {
        const al = Math.hypot(axisDir.x, axisDir.y, axisDir.z) || 1;
        const ax = { x: axisDir.x / al, y: axisDir.y / al, z: axisDir.z / al };
        const seed = Math.abs(ax.z) > 0.9 ? { x: 1, y: 0, z: 0 } : { x: 0, y: 0, z: 1 };
        const d = ax.x * seed.x + ax.y * seed.y + ax.z * seed.z;
        const p1u = { x: seed.x - d * ax.x, y: seed.y - d * ax.y, z: seed.z - d * ax.z };
        const p1l = Math.hypot(p1u.x, p1u.y, p1u.z) || 1;
        const perp1 = { x: p1u.x / p1l, y: p1u.y / p1l, z: p1u.z / p1l };
        const perp2 = {
            x: ax.y * perp1.z - ax.z * perp1.y, y: ax.z * perp1.x - ax.x * perp1.z, z: ax.x * perp1.y - ax.y * perp1.x,
        };
        const ring = (along, r, i, s) => {
            const th = (i / s) * Math.PI * 2, c = Math.cos(th) * r, sn = Math.sin(th) * r;
            return {
                x: center.x + ax.x * along + perp1.x * c + perp2.x * sn,
                y: center.y + ax.y * along + perp1.y * c + perp2.y * sn,
                z: center.z + ax.z * along + perp1.z * c + perp2.z * sn,
            };
        };
        const s = sides || N_FIT;
        const out = [];
        const slope = (rFar - rNear) / (2 * halfThick);
        for (let i = 0; i < s; i++) {
            const a0 = (i / s) * Math.PI * 2, a1 = ((i + 1) / s) * Math.PI * 2, am = (a0 + a1) / 2;
            const nx = Math.cos(am), ny = Math.sin(am);
            const radial = { x: perp1.x * nx + perp2.x * ny, y: perp1.y * nx + perp2.y * ny, z: perp1.z * nx + perp2.z * ny };
            const normal = { x: radial.x - ax.x * slope, y: radial.y - ax.y * slope, z: radial.z - ax.z * slope };
            out.push({ kind: "poly", pts: [ring(-halfThick, rNear, i, s), ring(-halfThick, rNear, i + 1, s), ring(halfThick, rFar, i + 1, s), ring(halfThick, rFar, i, s)], fill: faceShade(normal, color) });
        }
        const ptsF = [];
        for (let i = 0; i < s; i++)
            ptsF.push(ring(halfThick, rFar, i, s));
        out.push({ kind: "poly", pts: ptsF, fill: faceShade(ax, color) });
        const ptsB = [];
        for (let i = s; i > 0; i--)
            ptsB.push(ring(-halfThick, rNear, i - 1, s));
        out.push({ kind: "poly", pts: ptsB, fill: faceShade({ x: -ax.x, y: -ax.y, z: -ax.z }, color) });
        return out;
    };
    // solide de révolution générique à partir d'un profil (z, r) — seule
    // façon de représenter fidèlement une bride cou soudée (disque + collet
    // conique + collerette droite + saillie de face de joint), qui n'est PAS
    // un simple disque ni un simple tronc de cône mais un profil à plusieurs
    // sections ; z croissant le long de axisDir, r peut rester constant (pas
    // de facette) ou sauter à z identique (facette plate = épaulement, comme
    // la face avant du disque ou l'amorce du collet à l'arrière du disque)
    const revolveProfile = (basePos, axisDir, profile, color, sides) => {
        const al = Math.hypot(axisDir.x, axisDir.y, axisDir.z) || 1;
        const ax = { x: axisDir.x / al, y: axisDir.y / al, z: axisDir.z / al };
        const seed = Math.abs(ax.z) > 0.9 ? { x: 1, y: 0, z: 0 } : { x: 0, y: 0, z: 1 };
        const d = ax.x * seed.x + ax.y * seed.y + ax.z * seed.z;
        const p1u = { x: seed.x - d * ax.x, y: seed.y - d * ax.y, z: seed.z - d * ax.z };
        const p1l = Math.hypot(p1u.x, p1u.y, p1u.z) || 1;
        const perp1 = { x: p1u.x / p1l, y: p1u.y / p1l, z: p1u.z / p1l };
        const perp2 = {
            x: ax.y * perp1.z - ax.z * perp1.y, y: ax.z * perp1.x - ax.x * perp1.z, z: ax.x * perp1.y - ax.y * perp1.x,
        };
        const ring = (along, r, i, s) => {
            const th = (i / s) * Math.PI * 2, c = Math.cos(th) * r, sn = Math.sin(th) * r;
            return {
                x: basePos.x + ax.x * along + perp1.x * c + perp2.x * sn,
                y: basePos.y + ax.y * along + perp1.y * c + perp2.y * sn,
                z: basePos.z + ax.z * along + perp1.z * c + perp2.z * sn,
            };
        };
        const s = sides || N_FIT;
        const out = [];
        for (let k = 0; k < profile.length - 1; k++) {
            const z0 = profile[k].z, r0 = profile[k].r;
            const z1 = profile[k + 1].z, r1 = profile[k + 1].r;
            if (Math.abs(r0) < 1e-6 && Math.abs(r1) < 1e-6)
                continue; // segment dégénéré, sur l'axe
            const flat = Math.abs(z1 - z0) < 1e-9;
            for (let i = 0; i < s; i++) {
                let normal;
                if (flat) {
                    // épaulement : la face regarde vers l'arrière (-axe) si le
                    // rayon augmente en avançant sur le profil (ex. face avant
                    // du disque), vers l'avant (+axe) s'il diminue (ex. amorce
                    // du collet à l'arrière du disque)
                    const sign = r1 > r0 ? -1 : 1;
                    normal = { x: ax.x * sign, y: ax.y * sign, z: ax.z * sign };
                }
                else {
                    const a0 = (i / s) * Math.PI * 2, a1 = ((i + 1) / s) * Math.PI * 2, am = (a0 + a1) / 2;
                    const nx = Math.cos(am), ny = Math.sin(am);
                    const radial = { x: perp1.x * nx + perp2.x * ny, y: perp1.y * nx + perp2.y * ny, z: perp1.z * nx + perp2.z * ny };
                    const slope = (r1 - r0) / (z1 - z0);
                    normal = { x: radial.x - ax.x * slope, y: radial.y - ax.y * slope, z: radial.z - ax.z * slope };
                }
                out.push({ kind: "poly", pts: [ring(z0, r0, i, s), ring(z0, r0, i + 1, s), ring(z1, r1, i + 1, s), ring(z1, r1, i, s)], fill: faceShade(normal, color) });
            }
        }
        const first = profile[0], last = profile[profile.length - 1];
        if (first.r > 1e-6) {
            const pts = [];
            for (let i = 0; i < s; i++)
                pts.push(ring(first.z, first.r, i, s));
            out.push({ kind: "poly", pts, fill: faceShade({ x: -ax.x, y: -ax.y, z: -ax.z }, color) });
        }
        if (last.r > 1e-6) {
            const pts = [];
            for (let i = s; i > 0; i--)
                pts.push(ring(last.z, last.r, i - 1, s));
            out.push({ kind: "poly", pts, fill: faceShade(ax, color) });
        }
        return out;
    };
    // construit le profil (z, r) — EN UNITÉS MONDE (mm/100) — d'UNE bride cou
    // soudée EN 1092-1, z=0 = face avant (portée de joint, côté about/joint),
    // z croissant vers le bout à souder (extrémité côté tube)
    const weldNeckProfile = (spec) => {
        const mm = (v) => v / 100;
        const { D, C2, K, H2, N1, S, R, H3, d1, f1 } = spec;
        return [
            { z: mm(-f1), r: mm(d1) / 2 },
            { z: 0, r: mm(d1) / 2 },
            { z: 0, r: mm(D) / 2 },
            { z: mm(C2), r: mm(D) / 2 },
            { z: mm(C2), r: mm(N1) / 2 },
            { z: mm(H2 - H3), r: mm(spec.A) / 2 },
            { z: mm(H2), r: mm(spec.A) / 2 },
        ];
    };
    const AXIS_VEC = { x: { x: 1, y: 0, z: 0 }, y: { x: 0, y: 1, z: 0 }, z: { x: 0, y: 0, z: 1 } };
    const fittingPrimitives3D = (type, pos, axis, sign, rot, dn, baseColor, branchDn, bdir, shellDia, axis3d, shellLen, axOff) => {
        // axis est normalement une chaîne ('x'/'y'/'z', un vrai axe iso) mais
        // peut aussi être un vecteur {x,y,z} déjà normalisé — nécessaire pour
        // une casse, dont le tube réel suit une diagonale résultante qui n'est
        // pas un axe pur (le coude à l'angle du casse a lieu AVANT ce tronçon,
        // à la jonction avec le précédent, pas au milieu de sa propre diagonale)
        const isVec = typeof axis === "object" && axis !== null;
        const tangent = isVec ? axis : AXIS_VEC[axis];
        // direction de branche d'un té (te/tesw/teoduit) : world.bdir désigne
        // un des 6 axes MONDE fixes (+X/-X/+Y/-Y/+Z/-Z, même index que
        // ISO_DIRS6 utilisé par le symbole 2D) — PAS une rotation locale
        // autour du tube (wing/rot) comme les autres organes. C'est ce qui
        // garantit que la branche pointe dans le MÊME sens réel que ce que
        // l'utilisateur a choisi sur le croquis ISO, quel que soit l'angle de
        // vue 3D du moment ; sans ça la 3D dérive de l'intention posée en 2D
        const BDIR_WORLD = [
            { x: 1, y: 0, z: 0 }, { x: -1, y: 0, z: 0 },
            { x: 0, y: 1, z: 0 }, { x: 0, y: -1, z: 0 },
            { x: 0, y: 0, z: 1 }, { x: 0, y: 0, z: -1 },
        ];
        let bIdx = bdir;
        if (bIdx == null) {
            // même repli qu'en 2D : direction la plus perpendiculaire au tube
            // (jamais la branche alignée avec le tube lui-même)
            const tv = tangent;
            let bv = 2;
            bIdx = 4;
            BDIR_WORLD.forEach((dv, i) => {
                const v = Math.abs(dv.x * tv.x + dv.y * tv.y + dv.z * tv.z);
                if (v < bv) {
                    bv = v;
                    bIdx = i;
                }
            });
        }
        const bdirVec = BDIR_WORLD[bIdx];
        let wing1;
        if (isVec) {
            const seed = Math.abs(tangent.z) > 0.9 ? { x: 1, y: 0, z: 0 } : { x: 0, y: 0, z: 1 };
            const dot = tangent.x * seed.x + tangent.y * seed.y + tangent.z * seed.z;
            const w1u = { x: seed.x - dot * tangent.x, y: seed.y - dot * tangent.y, z: seed.z - dot * tangent.z };
            const w1len = Math.hypot(w1u.x, w1u.y, w1u.z) || 1;
            wing1 = { x: w1u.x / w1len, y: w1u.y / w1len, z: w1u.z / w1len };
        }
        else {
            wing1 = axis === "z" ? AXIS_VEC.x : AXIS_VEC.z;
        }
        // 2e axe perpendiculaire (produit vectoriel tangente × wing1), pour
        // pouvoir faire tourner l'écartement autour de la tangente du tube —
        // reproduit fidèlement la rotation "f.rot" appliquée en 2D (qui fait
        // tourner tout le symbole, donc son écartement, autour du tube)
        const wing2 = {
            x: tangent.y * wing1.z - tangent.z * wing1.y,
            y: tangent.z * wing1.x - tangent.x * wing1.z,
            z: tangent.x * wing1.y - tangent.y * wing1.x,
        };
        const rotRad = ((rot || 0) * Math.PI) / 180;
        const cr = Math.cos(rotRad), sr = Math.sin(rotRad);
        const wing = {
            x: wing1.x * cr + wing2.x * sr, y: wing1.y * cr + wing2.y * sr, z: wing1.z * cr + wing2.z * sr,
        };
        const P = (t, w) => ({
            x: pos.x + tangent.x * t + wing.x * w,
            y: pos.y + tangent.y * t + wing.y * w,
            z: pos.z + tangent.z * t + wing.z * w,
        });
        // point à 3 coordonnées locales (tangente + les 2 ailes NON tournées) —
        // utilisé pour les symboles qui doivent rester alignés sur les 3 vrais
        // axes iso quel que soit f.rot (ex : la croix de support)
        const P3 = (t, a1, a2) => ({
            x: pos.x + tangent.x * t + wing1.x * a1 + wing2.x * a2,
            y: pos.y + tangent.y * t + wing1.y * a1 + wing2.y * a2,
            z: pos.z + tangent.z * t + wing1.z * a1 + wing2.z * a2,
        });
        const line3 = (p1, p2) => ({ kind: "line", a: p1, b: p2 });
        const L = 0.62, W = 0.46; // demi-longueur / demi-largeur standard (≈60-45mm)
        const line = (t1, w1, t2, w2) => ({ kind: "line", a: P(t1, w1), b: P(t2, w2) });
        const poly = (pts, fill) => ({ kind: "poly", pts: pts.map(([t, w]) => P(t, w)), fill });
        const dot = (t, w, r) => ({ kind: "dot", p: P(t, w), r: r || 5 });
        // point sur l'axe du tube (tangente pure, sans écartement) — sert de
        // centre aux brides/corps des accessoires pleins
        const centerAt = (t) => ({ x: pos.x + tangent.x * t, y: pos.y + tangent.y * t, z: pos.z + tangent.z * t });
        const dir = Math.abs(((((rot || 0) % 360) + 360) % 360) - 180) < 90 ? -1 : 1;
        // rayon réel du tube au point d'accroche (échelle déjà établie ailleurs
        // dans l'appli : 1 unité = 100mm, DN en mm) — les corps pleins des
        // accessoires s'appuient dessus pour rester bien proportionnés au tube

        const pr = (dn || 100) / 200;
        const bc = baseColor || "#8A96A3";
        switch (type) {
            case "vanne": {
                // vanne à volant (opercule/vanne classique) : corps + 2 brides +
                // tige perpendiculaire + volant
                const bodyHalfLen = pr * 1.3, bodyR = pr * 1.1, flangeR = pr * 1.65, flangeHalfThick = pr * 0.2;
                const stemLen = pr * 1.3, stemR = pr * 0.22;
                const stemTip = { x: pos.x + wing.x * (bodyR + stemLen), y: pos.y + wing.y * (bodyR + stemLen), z: pos.z + wing.z * (bodyR + stemLen) };
                const stemMid = { x: pos.x + wing.x * (bodyR + stemLen / 2), y: pos.y + wing.y * (bodyR + stemLen / 2), z: pos.z + wing.z * (bodyR + stemLen / 2) };
                return [
                    ...discSolid(pos, tangent, bodyR, bodyHalfLen, bc, N_FIT, true),
                    ...discSolid(centerAt(-bodyHalfLen - flangeHalfThick), tangent, flangeR, flangeHalfThick, bc, N_FIT, true),
                    ...discSolid(centerAt(bodyHalfLen + flangeHalfThick), tangent, flangeR, flangeHalfThick, bc, N_FIT, true),
                    ...discSolid(stemMid, wing, stemR, stemLen / 2, bc, 6, true),
                    ...discSolid(stemTip, wing, pr * 0.55, pr * 0.09, bc, N_FIT, true),
                ];
            }
            case "boule": {
                // vanne à boule : corps renflé + 2 brides + tige + levier (barre,
                // pas un volant — signature visuelle d'une vanne 1/4 de tour)
                const bodyHalfLen = pr * 0.85, bodyR = pr * 1.25, flangeR = pr * 1.65, flangeHalfThick = pr * 0.2;
                const stemLen = pr * 1.1, stemR = pr * 0.2;
                const stemTip = { x: pos.x + wing.x * (bodyR + stemLen), y: pos.y + wing.y * (bodyR + stemLen), z: pos.z + wing.z * (bodyR + stemLen) };
                const stemMid = { x: pos.x + wing.x * (bodyR + stemLen / 2), y: pos.y + wing.y * (bodyR + stemLen / 2), z: pos.z + wing.z * (bodyR + stemLen / 2) };
                const leverLen = pr * 0.9, leverR = pr * 0.16;
                const leverMid = { x: stemTip.x + tangent.x * leverLen / 2, y: stemTip.y + tangent.y * leverLen / 2, z: stemTip.z + tangent.z * leverLen / 2 };
                return [
                    ...discSolid(pos, tangent, bodyR, bodyHalfLen, bc, N_FIT, true),
                    ...discSolid(centerAt(-bodyHalfLen - flangeHalfThick), tangent, flangeR, flangeHalfThick, bc, N_FIT, true),
                    ...discSolid(centerAt(bodyHalfLen + flangeHalfThick), tangent, flangeR, flangeHalfThick, bc, N_FIT, true),
                    ...discSolid(stemMid, wing, stemR, stemLen / 2, bc, 6, true),
                    ...discSolid(leverMid, tangent, leverR, leverLen / 2, bc, 6, true),
                ];
            }
            case "vpapillon": {
                // vanne papillon : simple disque fin (pas de corps allongé) +
                // petit boîtier d'actionneur compact
                const discR = pr * 1.35, discHalfThick = pr * 0.16;
                const stemLen = pr * 0.9, stemR = pr * 0.18;
                const stemMid = { x: pos.x + wing.x * (discR * 0.5 + stemLen / 2), y: pos.y + wing.y * (discR * 0.5 + stemLen / 2), z: pos.z + wing.z * (discR * 0.5 + stemLen / 2) };
                const actCenter = { x: pos.x + wing.x * (discR * 0.5 + stemLen), y: pos.y + wing.y * (discR * 0.5 + stemLen), z: pos.z + wing.z * (discR * 0.5 + stemLen) };
                return [
                    ...discSolid(pos, tangent, discR, discHalfThick, bc, N_FIT, true),
                    ...discSolid(stemMid, wing, stemR, stemLen / 2, bc, 6, true),
                    ...discSolid(actCenter, tangent, pr * 0.42, pr * 0.32, bc, 6, true),

            }
            case "clapet": {
                // clapet anti-retour : corps évasé dans le sens du flux (dir),
                // pas de tige/levier — automatique par nature
                const bodyHalfLen = pr * 0.85, flangeR = pr * 1.6, flangeHalfThick = pr * 0.2;
                const flowAxis = { x: tangent.x * dir, y: tangent.y * dir, z: tangent.z * dir };
                return [
                    ...coneSolid(pos, flowAxis, pr * 1.05, pr * 1.25, bodyHalfLen, bc, N_FIT),
                    ...discSolid(centerAt(-bodyHalfLen - flangeHalfThick), tangent, flangeR, flangeHalfThick, bc, N_FIT, true),
                    ...discSolid(centerAt(bodyHalfLen + flangeHalfThick), tangent, flangeR, flangeHalfThick, bc, N_FIT, true),
                ];
            }
            case "reduction": {
                // réduction concentrique : tronc de cône orienté par dir
                const halfLen = pr * 0.75;
                const flowAxis = { x: tangent.x * dir, y: tangent.y * dir, z: tangent.z * dir };
                return [...coneSolid(pos, flowAxis, pr * 0.62, pr * 1.05, halfLen, bc, N_FIT)];
            }
            case "bride": {
                // "jeu de bride" = un ASSEMBLAGE de 2 vraies brides cou à souder
                // EN 1092-1 (cotes exactes par DN), face à face, joint (jeu)
                // entre les deux, boulonnées avec le bon nombre/diamètre/
                // longueur de boulons tirés de la planche de référence
                const spec = flangeSpecFor(dn || 100);
                const mm = (v) => v / 100;
                const gap = mm(3); // épaisseur de joint typique, non tabulée
                const profile = weldNeckProfile(spec);
                // brides symétriques de part et d'autre de `pos`, face de
                // joint tournée vers le centre (vers l'autre bride)
